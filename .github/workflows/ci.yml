name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify offline checks
        run: bun run verify

      - name: Check formatting
        run: bun run format:check

  soroban-registry:
    name: Soroban registry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/soroban-registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test
