name: flovia-lightsail

x-bff-runtime-limits: &bff-runtime-limits
  cpus: ${BFF_CPUS:-1.5}
  mem_limit: ${BFF_MEMORY_LIMIT:-800m}
  memswap_limit: ${BFF_MEMORY_SWAP_LIMIT:-4g}
  pids_limit: ${BFF_PIDS_LIMIT:-256}
  oom_score_adj: ${BFF_OOM_SCORE_ADJ:-500}
  oom_kill_disable: false
  init: true

x-main-bff: &main-bff
  <<: *bff-runtime-limits
  image: ${BFF_IMAGE_REPOSITORY:?BFF_IMAGE_REPOSITORY is required}:${MAIN_BFF_IMAGE_TAG:-main}
  environment:
    BFF_BRANCH_NAME: main
    PORT: 3001
    DATABASE_URL: /data/flovia.db
    BFF_DEPLOY_ID: ${MAIN_BFF_IMAGE_TAG:-main}
    AWS_REGION: ${AWS_REGION:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    BFF_BEDROCK_MODEL_ID: ${BFF_BEDROCK_MODEL_ID:-}
    BFF_BEDROCK_PROMPT_VERSION: ${BFF_BEDROCK_PROMPT_VERSION:-}
    BFF_ANALYTICS_SOURCE: ${MAIN_BFF_ANALYTICS_SOURCE:-${BFF_ANALYTICS_SOURCE:-}}
    BFF_ANALYTICS_DATABASE_URL: ${MAIN_BFF_ANALYTICS_DATABASE_URL:-${BFF_ANALYTICS_DATABASE_URL:-}}
    BFF_ANALYTICS_POSTGRES_MODE: ${MAIN_BFF_ANALYTICS_POSTGRES_MODE:-snapshot}
    BFF_ANALYTICS_READ_MODEL_PATH: ${MAIN_BFF_ANALYTICS_READ_MODEL_PATH:-${BFF_ANALYTICS_READ_MODEL_PATH:-}}
    BFF_ANALYTICS_SNAPSHOT_ID: ${MAIN_BFF_ANALYTICS_SNAPSHOT_ID:-${BFF_ANALYTICS_SNAPSHOT_ID:-latest}}

    # Authorized x402 discovery refresh token.
    # External cron POSTs /aeo/x402/refresh.
    # Empty -> refresh endpoint disabled (403).
    BFF_X402_REFRESH_TOKEN: ${MAIN_BFF_X402_REFRESH_TOKEN:-${BFF_X402_REFRESH_TOKEN:-}}

    # Persist refreshed discovery data on the /data volume.
    BFF_X402_DISCOVERY_DATA_DIR: /data/x402-discovery

    # Production payment configuration.
    # MAIN_* secrets are required and do not fall back to development secrets.
    HITPAY_API_KEY: ${MAIN_HITPAY_API_KEY:?MAIN_HITPAY_API_KEY is required}
    HITPAY_WEBHOOK_SALT: ${MAIN_HITPAY_WEBHOOK_SALT:?MAIN_HITPAY_WEBHOOK_SALT is required}
    HITPAY_MPP_ENDPOINT: ${MAIN_HITPAY_MPP_ENDPOINT:?MAIN_HITPAY_MPP_ENDPOINT is required}

  volumes:
    - ${MAIN_FLOVIA_DATA_DIR:?MAIN_FLOVIA_DATA_DIR is required}:/data
  expose:
    - "3001"
  restart: unless-stopped

x-develop-bff: &develop-bff
  <<: *bff-runtime-limits
  image: ${BFF_IMAGE_REPOSITORY:?BFF_IMAGE_REPOSITORY is required}:${DEVELOP_BFF_IMAGE_TAG:-develop}
  environment:
    BFF_BRANCH_NAME: develop
    PORT: 3001
    DATABASE_URL: /data/flovia.db
    BFF_DEPLOY_ID: ${DEVELOP_BFF_IMAGE_TAG:-develop}
    AWS_REGION: ${AWS_REGION:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    BFF_BEDROCK_MODEL_ID: ${BFF_BEDROCK_MODEL_ID:-}
    BFF_BEDROCK_PROMPT_VERSION: ${BFF_BEDROCK_PROMPT_VERSION:-}
    BFF_ANALYTICS_SOURCE: ${DEVELOP_BFF_ANALYTICS_SOURCE:-${BFF_ANALYTICS_SOURCE:-}}
    BFF_ANALYTICS_DATABASE_URL: ${DEVELOP_BFF_ANALYTICS_DATABASE_URL:-${BFF_ANALYTICS_DATABASE_URL:-}}
    BFF_ANALYTICS_POSTGRES_MODE: ${DEVELOP_BFF_ANALYTICS_POSTGRES_MODE:-snapshot}
    BFF_ANALYTICS_READ_MODEL_PATH: ${DEVELOP_BFF_ANALYTICS_READ_MODEL_PATH:-${BFF_ANALYTICS_READ_MODEL_PATH:-}}
    BFF_ANALYTICS_SNAPSHOT_ID: ${DEVELOP_BFF_ANALYTICS_SNAPSHOT_ID:-${BFF_ANALYTICS_SNAPSHOT_ID:-latest}}

    # Authorized x402 discovery refresh token.
    # External cron POSTs /aeo/x402/refresh.
    # Empty -> refresh endpoint disabled (403).
    BFF_X402_REFRESH_TOKEN: ${DEVELOP_BFF_X402_REFRESH_TOKEN:-${BFF_X402_REFRESH_TOKEN:-}}

    # Persist refreshed discovery data on the /data volume.
    BFF_X402_DISCOVERY_DATA_DIR: /data/x402-discovery

    HITPAY_API_KEY: ${DEVELOP_HITPAY_API_KEY:-${HITPAY_API_KEY:-}}
    HITPAY_WEBHOOK_SALT: ${DEVELOP_HITPAY_WEBHOOK_SALT:-${HITPAY_WEBHOOK_SALT:-}}
    HITPAY_MPP_ENDPOINT: ${DEVELOP_HITPAY_MPP_ENDPOINT:-${HITPAY_MPP_ENDPOINT:-https://sandbox.mpp.hitpay.dev}}
    STRIPE_SECRET_KEY: ${DEVELOP_STRIPE_SECRET_KEY:-${STRIPE_SECRET_KEY:-}}
    MPPX_PRIVATE_KEY: ${DEVELOP_MPPX_PRIVATE_KEY:-${MPPX_PRIVATE_KEY:-}}
    MPP_SECRET_KEY: ${DEVELOP_MPP_SECRET_KEY:-}
    SOLANA_MPP_RECIPIENT: ${DEVELOP_SOLANA_MPP_RECIPIENT:-${SOLANA_MPP_RECIPIENT:-}}
    SOLANA_MPP_NETWORK: ${DEVELOP_SOLANA_MPP_NETWORK:-${SOLANA_MPP_NETWORK:-devnet}}
    SOLANA_MPP_CURRENCY: ${DEVELOP_SOLANA_MPP_CURRENCY:-${SOLANA_MPP_CURRENCY:-4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU}}
    SOLANA_MPP_SECRET_KEY: ${DEVELOP_SOLANA_MPP_SECRET_KEY:-}
    SOLANA_MPP_PAYER_PRIVATE_KEY: ${DEVELOP_SOLANA_MPP_PAYER_PRIVATE_KEY:-${SOLANA_MPP_PAYER_PRIVATE_KEY:-}}
    SOLANA_MPP_RPC_URL: ${DEVELOP_SOLANA_MPP_RPC_URL:-${SOLANA_MPP_RPC_URL:-}}

  volumes:
    - ${DEVELOP_FLOVIA_DATA_DIR:?DEVELOP_FLOVIA_DATA_DIR is required}:/data
  expose:
    - "3001"
  restart: unless-stopped

services:
  main-bff-blue:
    <<: *main-bff

  main-bff-green:
    <<: *main-bff

  develop-bff-blue:
    <<: *develop-bff

  develop-bff-green:
    <<: *develop-bff

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
