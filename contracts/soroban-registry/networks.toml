# HANDLE Stellar network profiles (reference; mirrors
# packages/x402-stellar/src/networks.ts, which tests re-derive the SAC IDs).
#
# The Stellar CLI does not read this file. Register the profiles once with
# the `stellar network add` commands in README.md#networks. Profile names
# match STELLAR_NETWORK, so the same env value drives the app and the CLI.
#
# Never commit secrets here. The admin key lives in the CLI keystore
# (`stellar keys generate`) or a secret store, never in the repo.

